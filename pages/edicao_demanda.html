<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cadastro_demanda_style.css">
    <script src="edicao_demanda.js" defer></script>
</head>
<body>

    <header>
        <h1>Nome do Site</h1>
        <a href="#menu">Menu</a>
    </header>
    <div class="principal">
        
        <h1 id="titulo">Editar Demanda</h1>
    
        <h2>Nome</h2>
        <input type="text" placeholder="Digite o nome da demanda" class="campo campo_nome">
        <p id="erro_nome">Digite o nome</p>
    
        <h2>Descrição</h2>
        <input type="text" placeholder="Digite a descrição da demanda" class="campo campo_desc">
        <p id="erro_desc">Digite a descrição</p>

        <h2>Projeto Associado</h2>
        <input type="text" placeholder="Digite o projeto associado" class="campo campo_assoc">
        <p id="erro_assoc">Digite o projeto</p>

        <div class="opcoes">
            <h2>Tipo</h2>
            <div>
                <input type="radio" name="Tipo" value="Tarefa">
                <label>Tarefa</label>
            </div>
        
            <div>
                <input type="radio" name="Tipo" value="Defeito">
                <label>Defeito</label>
            </div>
        
            <div>
                <input type="radio" name="Tipo" value="Melhoria">
                <label>Melhoria</label>
            </div>
        
            <div>
                <input type="radio" name="Tipo" value="Documentação">
                <label>Documentação</label>
            </div>
            <p id="erro_tipos">Escolha uma opção</p>
        </div>
    
        <div class="opcoes">
            <h2>Prioridade</h2>
    
            <div>
                <input type="radio" name="Prioridade" value="Crítica">
                <label for="ads">Crítica</label>
            </div>
        
            <div>
                <input type="radio" name="Prioridade" value="Alta">
                <label for="engenharia">Alta</label>
            </div>
        
            <div>
                <input type="radio" name="Prioridade" value="Média">
                <label for="ciencia">Média</label>
            </div>
            <div>
                <input type="radio" name="Prioridade" value="Baixa">
                <label for="ads">Baixa</label>
            </div>
            <p id="erro_prio">Escolha uma opção</p>
        </div>
    
        <div class="opcoes">
            <h2>Status</h2>
            <div>
                <input type="radio" name="Status" value="Aberta">
                <label for="ads">Aberta</label>
            </div>
        
            <div>
                <input type="radio" name="Status" value="Em andamento">
                <label for="engenharia">Em andamento</label>
            </div>
        
            <div>
                <input type="radio" name="Status" value="Em revisão">
                <label for="ciencia">Em revisão</label>
            </div>
        
            <div>
                <input type="radio" name="Status" value="Concluída">
                <label for="ads">Concluída</label>
            </div>
        
            <div>
                <input type="radio" name="Status" value="Cancelada">
                <label for="ads">Cancelada</label>
            </div>
            <p id="erro_status">Escolha uma opção</p>
        </div>
    
        <h2>Prazo de Finalização</h2>
        <input type="date" class = "data">
        <p id="erro_prazo">Selecione uma data</p>
    
        <button class="botao">Salvar Alterações</button>
    </div>
</body>
</html>
