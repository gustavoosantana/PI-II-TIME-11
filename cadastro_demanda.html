<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cadastro_demanda_style.css">
</head>
<body>

    <header>
        <h1>Nome do Site</h1>
        <a href="#menu">Menu</a>
    </header>
    <h1>Cadastrar Demanda</h1>

    <h2>Nome</h2>
    <input type="text" placeholder="Digite o nome da demanda">

    <h2>Descrição</h2>
    <input type="text" placeholder="Digite a descrição da demanda">

    <h2>Projeto Associado</h2>
    <input type="text" placeholder="Digite o projeto associado">

    <h2>Tipo</h2>
    <input type="radio" name="Tipo">
    <label for="ads">Tarefa</label>

    <input type="radio" name="Tipo">
    <label for="engenharia">Defeito</label>

    <input type="radio" name="Tipo">
    <label for="ciencia">Melhoria</label>

    <input type="radio" name="Tipo">
    <label for="ads">Documentaçãoo</label>

    <h2>Prioridade</h2>
    <input type="radio" name="Prioridade">
    <label for="ads">Crítica</label>

    <input type="radio" name="Prioridade">
    <label for="engenharia">Alta</label>

    <input type="radio" name="Prioridade">
    <label for="ciencia">Média</label>

    <input type="radio" name="Prioridade">
    <label for="ads">Baixa</label>

    <h2>Status</h2>
    <input type="radio" name="Prioridade">
    <label for="ads">Aberta</label>

    <input type="radio" name="Prioridade">
    <label for="engenharia">Em andamento</label>

    <input type="radio" name="Prioridade">
    <label for="ciencia">Em revisão</label>

    <input type="radio" name="Prioridade">
    <label for="ads">Concluída</label>

    <input type="radio" name="Prioridade">
    <label for="ads">Cancelada</label>

    <h2>Prazo de Finalização</h2>
    <input type="date">

    <button>Cadastrar</button>
</body>
</html>
